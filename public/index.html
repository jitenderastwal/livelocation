<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LiveLocation</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
     integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
     crossorigin=""/>
     <style>
        #map { height: 90vh; }
     </style>
</head>
<body>
     
     <div id="map"></div>
     <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
     integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
     crossorigin=""></script>

     <script>
          const map = L.map('map').setView([51.505, -0.09], 13);
          L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '&copy; <a href="http://www.openstreetmap.org/copyright">OpenStreetMap</a>'
}).addTo(map);
     </script>

      <script src="/socket.io/socket.io.js"></script>
     <script>
          const socket = io();

          const remoteMarkers = {};
          socket.on('locationUpdate', (data) => {
               const { latitude, longitude } = data;
               console.log(`Received location update: Latitude: ${latitude}, Longitude: ${longitude}`);
               
               if (remoteMarkers[socket.id]) {
                    remoteMarkers[socket.id].setLatLng([latitude, longitude]);
               } else {
                    remoteMarkers[socket.id] = L.marker([latitude, longitude]).addTo(map);
               }
          });
          function getUserCurrentLocation() {
               return new Promise((resolve, reject) => {
                    if ("geolocation" in navigator) {
                         navigator.geolocation.getCurrentPosition(
                              (position) => {
                                   const { latitude, longitude } = position.coords;
                                   resolve({ latitude, longitude });
                              },
                              (error) => {
                                   reject(error);
                              },
                              {enableHighAccuracy: true}
                         );
                    } else {
                         reject(new Error("Geolocation is not supported by this browser."));
                    }    
               });
          }
           
          let mycurrentLocationMarker = null;

          async function main() {
               setInterval(async () => {
                    try {
                         const { latitude, longitude } = await getUserCurrentLocation();
                         console.log(`Latitude: ${latitude}, Longitude: ${longitude}`);
                         socket.emit('locationUpdate', { latitude, longitude });
                         if (mycurrentLocationMarker) {
                              mycurrentLocationMarker.setLatLng([latitude, longitude]);
                         } else {
                              mycurrentLocationMarker = L.marker([latitude, longitude]).addTo(map);
                         }
                         
                         map.setView([latitude, longitude], 13);
                    } catch (error) {
                         console.error("Error getting location:", error);
                    }
               }, 5000); // Update every 5 seconds
          }
          window.addEventListener('load', main)
          
     </script>
</body>
</html>
